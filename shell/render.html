<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<!-- the render frame of request actions: a sandboxed page (manifest "sandbox"), the only place that runs code the
     user typed. it has no chrome.* and no access to the extension's data; links open in a new tab.
     #out shows what the render function returned -->
<base id="base" target="_blank">
<style>
  html, body { margin: 0; }
  #out { padding: 8px; overflow-wrap: anywhere; }
  #out.text { white-space: pre-wrap; }
  #out .err { color: #c62828; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="out"></div>
<script src="render-frame.js"></script>
</body>
</html>
