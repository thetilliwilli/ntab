<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- the render frame of request actions: a sandboxed page (manifest "sandbox"), the only place that runs code the
     user typed. it has no chrome.* and no access to the extension's data; links open in a new tab -->
<base target="_blank">
<style>
  html, body { margin: 0; }
  body { padding: 8px; overflow-wrap: anywhere; }
  body.text { white-space: pre-wrap; }
  .err { color: #c62828; white-space: pre-wrap; }
</style>
</head>
<body>
<script src="render-frame.js"></script>
</body>
</html>
