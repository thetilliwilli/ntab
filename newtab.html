<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>newtab</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAQAAAAA3bvkkAAAAAnRSTlMAAHaTzTgAAAAKSURBVAjXY2AAAAACAAHiIbwzAAAAAElFTkSuQmCC">
  <link rel="stylesheet" href="newtab.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <aside class="side">
    <button class="side-btn side-home" id="go-home" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5" /></svg>
    </button>
    <nav class="links" id="links" aria-label="Actions"></nav>
    <button class="side-btn" id="theme-btn" aria-label="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"></svg></button>
    <button class="side-btn" id="links-edit" title="Edit actions" aria-label="Edit actions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4" /></svg>
    </button>
  </aside>

  <section class="home" id="home" aria-label="Home">
    <div class="home-grid" id="home-grid"></div>
  </section>

  <main class="main" id="notepad" hidden>
    <div class="tabbar">
      <button class="tb-add" id="tab-add" title="Open a saved note (double-click the free space for a new one)">+</button>
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="gate" id="gate" hidden>
      <p id="gate-msg"></p>
      <div class="gate-actions">
        <button class="primary" id="gate-btn"></button>
        <button id="gate-alt" hidden>choose another folder…</button>
      </div>
    </div>

    <div class="editor" id="editor" hidden>
      <div class="gutter" id="gutter"><div class="gutter-inner" id="gutter-inner"></div></div>
      <textarea id="text" wrap="off" spellcheck="false" autocomplete="off" aria-label="Note text"></textarea>
      <div class="mirror" id="mirror" aria-hidden="true"></div>
    </div>

    <div class="nothing" id="nothing" hidden>
      <div class="nothing-box">
        <div class="nothing-head">
          <span class="nothing-title">No open notes · <span id="nothing-dir"></span></span>
          <button class="primary" id="nothing-new">+ new note</button>
          <button id="nothing-change">change folder…</button>
        </div>
        <input id="nothing-filter" class="file-filter" placeholder="filter by name…" aria-label="Filter notes by name" spellcheck="false">
        <div id="nothing-list" class="file-list"></div>
      </div>
    </div>

    <div class="close-panel" id="close-panel" hidden>
      <span>Close <b id="cp-name"></b> — save as</span>
      <input id="cp-input" aria-label="File name to save as" spellcheck="false">
      <button id="cp-first" title="Use the first line of the note">first line</button>
      <button id="cp-current" title="Use the current tab name">current name</button>
      <button id="cp-save" class="primary">save &amp; close</button>
      <button id="cp-cancel">cancel</button>
    </div>

    <footer class="status">
      <span id="st-pos">Ln 1, Col 1</span>
      <span id="st-len">0 chars</span>
      <span id="st-save" class="st-save"></span>
      <span class="spacer"></span>
      <button id="font-dec" title="Smaller font">A−</button>
      <span id="font-size" class="st-num"></span>
      <button id="font-inc" title="Larger font">A+</button>
      <button id="wrap" class="toggle" title="Word wrap">Wrap</button>
      <label class="st-field" title="Spaces inserted by Tab">Tab<input id="tab-size" type="number" min="1" max="8" aria-label="Spaces per Tab"></label>
    </footer>
  </main>

  <dialog id="files" class="dlg">
    <div class="dlg-head">
      <h2>Notes · <span id="files-dir"></span></h2>
      <button id="files-change">change folder…</button>
      <button id="files-close" class="dlg-x" title="Close">×</button>
    </div>
    <div class="dlg-body">
      <input id="files-filter" class="file-filter" placeholder="filter by name…" aria-label="Filter notes by name" spellcheck="false">
      <div id="files-list" class="file-list"></div>
    </div>
  </dialog>

  <dialog id="sc" class="dlg dlg-wide">
    <div class="dlg-head">
      <h2>Actions</h2>
      <div class="seg">
        <button id="sc-mode-form">Form</button>
        <button id="sc-mode-json">JSON</button>
      </div>
      <button id="sc-x" class="dlg-x" title="Close">×</button>
    </div>
    <div class="dlg-body">
      <div id="sc-form">
        <div id="sc-rows"></div>
        <div class="sc-nonotes" id="sc-nonotes" hidden>
          <span>Notepad isn't in the list — without it there is no way to open your notes.</span>
          <button id="sc-notes-back">add it back</button>
        </div>
        <div class="sc-adds">
          <button id="sc-add" class="add">+ link</button>
          <button id="sc-add-notes" class="add">+ notepad</button>
        </div>
      </div>
      <div id="sc-json" hidden>
        <p class="muted hint">Array of links <code>{ "name": "…", "url": "…", "target": "_blank" }</code> (<code>target</code> is optional)
          and the notepad <code>{ "type": "notes", "name": "Notes" }</code>.</p>
        <textarea id="sc-json-text" spellcheck="false" aria-label="Shortcuts JSON"></textarea>
        <p id="sc-json-err" class="err"></p>
      </div>
    </div>
    <div class="dlg-foot">
      <span id="sc-msg" class="msg"></span>
      <button id="sc-cancel">Cancel</button>
      <button id="sc-save" class="primary">Save</button>
    </div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
